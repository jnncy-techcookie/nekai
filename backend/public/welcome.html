<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEKAI — Pick your genres</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preload" href="assets/fonts/The%20Last%20Shuriken.ttf" as="font" type="font/ttf" crossorigin>
  <!-- boot.js applies saved display settings (dark mode) before the first paint -->
  <script src="js/core/boot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
  <script src="js/data/sample-data.js" defer></script>
  <script src="js/core/supabase.js" defer></script>
  <!-- start.js checks the session, loads the user's data, then runs these in order -->
  <script src="js/core/start.js" defer data-app="js/core/store.js js/services/tenrai.js js/core/ui.js js/pages/welcome.js"></script>
</head>
<body class="paper">
  <main class="ob" id="main">
    <header class="ob-brand">
      <span class="brand-mark brand-logo" aria-hidden="true">
        <img class="logo-l" src="assets/images/logo-light.png" alt="" width="44" height="44">
        <img class="logo-d" src="assets/images/logo-dark.png" alt="" width="44" height="44">
      </span>
      <span class="brand-word brand-wordmark" role="img" aria-label="NEKAI">
        <img class="logo-l" src="assets/images/logo-text-light.png?v=2" alt="" width="104" height="24">
        <img class="logo-d" src="assets/images/logo-text-dark.png?v=2" alt="" width="105" height="24">
      </span>
    </header>

    <section class="ob-card" aria-labelledby="ob-h">
      <div class="ob-head">
        <p id="ob-hi" class="ob-kicker">Welcome to NEKAI</p>
        <h1 id="ob-h" class="h1 display-title ob-title">Pick 3 genres you love</h1>
        <p class="ob-sub">Your first AI picks start from these, until you begin adding and rating shows.</p>
      </div>

      <div id="ob-grid" class="ob-grid" role="group" aria-labelledby="ob-h" aria-describedby="ob-count"></div>

      <footer class="ob-foot">
        <div class="ob-progress">
          <div class="ob-bar" aria-hidden="true"><span id="ob-fill"></span></div>
          <p id="ob-count" class="ob-count" role="status">Pick 3 to continue</p>
        </div>
        <button id="ob-go" type="button" class="btn btn-primary ob-go" disabled>Start watching<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
      </footer>
    </section>
  </main>
</body>
</html>
