<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" font-family="'Segoe UI', Arial, Helvetica, sans-serif" fill="#0F1F5C">
  <title>NEKAI system architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1F5C"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E25200"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
    <style>
      .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .line { stroke: #0F1F5C; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
      .cd   { stroke: #E25200; stroke-width: 2.5; fill: none; marker-end: url(#arrO); }
      .ext  { stroke: #666; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; marker-end: url(#arrG); }
      .name { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .det  { font-size: 13.5px; text-anchor: middle; }
      .note { font-size: 12.5px; }
      .reg  { font-size: 14px; font-weight: 700; }
      .box  { fill: #E8EEFF; stroke: #1F3FA6; stroke-width: 2.5; }
      .vol  { fill: #E3F3E3; stroke: #2E7D32; stroke-width: 2.5; }
      .out  { fill: #EFEFEF; stroke: #777; stroke-width: 2; stroke-dasharray: 8 5; }
      .num  { fill: #0F1F5C; }
      .numt { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#FFFDF7"/>
  <text x="40" y="48" font-size="30" font-weight="800">NEKAI: system architecture</text>
  <text x="40" y="76" font-size="15" fill="#3A4A85">Containers, ports, networks, volumes and request flow. The application and the CI/CD server are two separate compose projects.</text>

  <!-- Docker host -->
  <rect x="240" y="95" width="1070" height="985" rx="18" fill="#F6F1E3" stroke="#0F1F5C" stroke-width="2.5"/>
  <text x="262" y="122" class="reg">Docker host (the machine running Docker Desktop / Docker Engine)</text>

  <!-- Compose project: application -->
  <rect x="260" y="135" width="1030" height="655" rx="14" fill="#FFFFFF" stroke="#1F3FA6" stroke-width="2"/>
  <text x="280" y="160" class="reg">Application stack: docker-compose.yml  (docker compose up -d --build)</text>

  <!-- networks -->
  <rect x="280" y="178" width="620" height="440" rx="12" fill="#1F3FA6" fill-opacity="0.06" stroke="#1F3FA6" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="296" y="200" class="reg" fill="#1F3FA6">web-net</text>
  <rect x="640" y="470" width="260" height="312" rx="12" fill="#F25C05" fill-opacity="0.08" stroke="#E25200" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="654" y="771" class="reg" fill="#C24400">data-net</text>

  <!-- arrows (drawn first so boxes sit on top) -->
  <path class="line" d="M200,395 H300"/>
  <path class="line" d="M490,395 H545 V245 H660"/>
  <path class="line" d="M490,395 H660"/>
  <path class="line" d="M490,395 H545 V545 H660"/>
  <path class="line" d="M770,445 V495"/>
  <path class="line" d="M770,595 V655"/>
  <path class="line" d="M880,580 H940"/>
  <path class="line" d="M880,705 H940"/>
  <path class="ext"  d="M880,395 H1340"/>
  <path class="ext"  d="M880,515 H1340"/>

  <!-- browser -->
  <rect class="box" x="30" y="340" width="170" height="110" rx="10" style="fill:#fff"/>
  <text x="115" y="378" class="name">Browser</text>
  <text x="115" y="402" class="det">the user</text>
  <text x="115" y="422" class="det">http://localhost:8080</text>

  <!-- proxy (published) -->
  <rect x="300" y="340" width="190" height="110" rx="10" fill="#FFE6D3" stroke="#E25200" stroke-width="4"/>
  <text x="395" y="368" class="name">proxy</text>
  <text x="395" y="391" class="det">nginx-unprivileged 1.27.5</text>
  <text x="395" y="410" class="det">listens :8080</text>
  <text x="395" y="434" class="det" font-weight="700" fill="#C24400">PUBLISHED: host 8080</text>

  <!-- routing numbers -->
  <circle class="num" cx="603" cy="245" r="12"/><text class="numt" x="603" y="250">1</text>
  <circle class="num" cx="580" cy="395" r="12"/><text class="numt" x="580" y="400">2</text>
  <circle class="num" cx="603" cy="545" r="12"/><text class="numt" x="603" y="550">3</text>

  <!-- frontend -->
  <rect class="box" x="660" y="195" width="220" height="100" rx="10"/>
  <text x="770" y="224" class="name">frontend</text>
  <text x="770" y="248" class="det">nginx-unprivileged 1.27.5</text>
  <text x="770" y="266" class="det">static site · :8080 (internal)</text>
  <text x="770" y="284" class="det">/build.json = build label</text>

  <!-- ai-service -->
  <rect class="box" x="660" y="345" width="220" height="100" rx="10"/>
  <text x="770" y="374" class="name">ai-service</text>
  <text x="770" y="398" class="det">Node 24.22.0 · Express 5</text>
  <text x="770" y="416" class="det">:3001 · GET /health</text>
  <text x="770" y="434" class="det">Neko chat · Nekai's Picks</text>

  <!-- api -->
  <rect class="box" x="660" y="495" width="220" height="100" rx="10"/>
  <text x="770" y="524" class="name">api</text>
  <text x="770" y="548" class="det">Node 24.22.0 · Express 5</text>
  <text x="770" y="566" class="det">:3000 · GET /api/health</text>
  <text x="770" y="584" class="det">accounts · user data · anime</text>

  <!-- db -->
  <rect class="box" x="660" y="655" width="220" height="100" rx="10"/>
  <text x="770" y="684" class="name">db</text>
  <text x="770" y="708" class="det">PostgreSQL 16.15</text>
  <text x="770" y="726" class="det">:5432 · NOT published</text>
  <text x="770" y="744" class="det">schema: db/init.sql (13 tables)</text>

  <!-- internal arrow labels -->
  <text x="782" y="476" class="note halo">session + anime</text>
  <text x="782" y="631" class="note halo">SQL :5432</text>

  <!-- volumes -->
  <rect class="vol" x="940" y="545" width="190" height="70" rx="10"/>
  <text x="1035" y="573" class="name" style="font-size:18px">uploads</text>
  <text x="1035" y="595" class="det">profile pictures /data/uploads</text>
  <rect class="vol" x="940" y="670" width="190" height="70" rx="10"/>
  <text x="1035" y="698" class="name" style="font-size:18px">pg-data</text>
  <text x="1035" y="720" class="det">/var/lib/postgresql/data</text>
  <text x="1150" y="578" class="note">named volume</text>
  <text x="1150" y="703" class="note">named volume</text>

  <!-- routing legend -->
  <rect x="940" y="195" width="345" height="140" rx="10" fill="#fff" stroke="#0F1F5C" stroke-width="1.5"/>
  <text x="956" y="220" class="reg">Request routing (proxy/nginx.conf)</text>
  <circle class="num" cx="962" cy="241" r="9"/><text class="numt" x="962" y="245" style="font-size:12px">1</text>
  <text x="978" y="246" class="note">/  →  frontend:8080</text>
  <circle class="num" cx="962" cy="266" r="9"/><text class="numt" x="962" y="270" style="font-size:12px">2</text>
  <text x="978" y="271" class="note">/api/neko/, /api/recommend  →  ai-service:3001</text>
  <circle class="num" cx="962" cy="291" r="9"/><text class="numt" x="962" y="295" style="font-size:12px">3</text>
  <text x="978" y="296" class="note">/api/*, /avatars/*  →  api:3000</text>
  <text x="956" y="321" class="note" fill="#3A4A85">/health is answered by the proxy itself</text>

  <!-- external services -->
  <rect class="out" x="1340" y="350" width="230" height="90" rx="10"/>
  <text x="1455" y="381" class="name" style="font-size:18px">Google Gemini API</text>
  <text x="1455" y="403" class="det">external · HTTPS</text>
  <text x="1455" y="422" class="det">key from GEMINI_API_KEY</text>
  <rect class="out" x="1340" y="470" width="230" height="90" rx="10"/>
  <text x="1455" y="501" class="name" style="font-size:18px">Tenrai API</text>
  <text x="1455" y="523" class="det">external · HTTPS</text>
  <text x="1455" y="542" class="det">MyAnimeList anime data</text>
  <text x="1110" y="385" class="note halo" text-anchor="middle">HTTPS (outbound)</text>
  <text x="1110" y="505" class="note halo" text-anchor="middle">HTTPS (outbound)</text>

  <text x="290" y="778" class="note" fill="#3A4A85">images: nekai/&lt;service&gt;:${TAG}</text>

  <!-- Jenkins stack -->
  <rect x="260" y="830" width="1030" height="225" rx="14" fill="#FFF6EA" stroke="#E25200" stroke-width="2"/>
  <text x="280" y="855" class="reg" fill="#C24400">CI/CD stack: infra/jenkins/docker-compose.yml  (separate from the app)</text>
  <!-- CI/CD arrows: drawn after the region so its fill does not cover them -->
  <path class="cd"   d="M210,925 H300"/>
  <path class="cd"   d="M115,790 V880"/>
  <path class="cd"   d="M600,925 H700"/>
  <path class="cd"   d="M865,880 V790"/>
  <path d="M450,970 V990" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
  <rect x="300" y="880" width="300" height="90" rx="10" fill="#FFE6D3" stroke="#E25200" stroke-width="2.5"/>
  <text x="450" y="906" class="name" style="font-size:19px">jenkins</text>
  <text x="450" y="928" class="det">jenkins/jenkins:2.580.1-jdk21 + Docker CLI</text>
  <text x="450" y="946" class="det">UI 127.0.0.1:8081 → :8080 · runs as root (lab)</text>
  <text x="450" y="963" class="det">Jenkinsfile · Jenkinsfile.rollback</text>
  <rect class="vol" x="300" y="990" width="300" height="50" rx="10"/>
  <text x="450" y="1011" class="name" style="font-size:16px">jenkins_home</text>
  <text x="450" y="1030" class="det" style="font-size:12.5px">named volume: jobs, plugins, credentials</text>
  <rect x="700" y="880" width="330" height="110" rx="10" fill="#fff" stroke="#E25200" stroke-width="2.5"/>
  <text x="865" y="908" class="name" style="font-size:19px">Host Docker Engine</text>
  <text x="865" y="931" class="det">/var/run/docker.sock mounted into Jenkins</text>
  <text x="865" y="950" class="det">builds the nekai/* images (tag = build #)</text>
  <text x="865" y="969" class="det">runs docker compose up -d</text>
  <text x="650" y="915" class="note halo" text-anchor="middle" fill="#C24400">docker CLI</text>
  <text x="880" y="816" class="note halo" fill="#C24400">docker compose up -d --no-build --wait</text>

  <!-- developer / GitHub -->
  <rect class="box" x="20" y="720" width="190" height="70" rx="10" style="fill:#fff"/>
  <text x="115" y="750" class="name" style="font-size:18px">Developer</text>
  <text x="115" y="771" class="det">git push (feature → main)</text>
  <rect class="box" x="20" y="880" width="190" height="90" rx="10" style="fill:#fff"/>
  <text x="115" y="910" class="name" style="font-size:18px">GitHub</text>
  <text x="115" y="932" class="det">jnncy-techcookie/nekai</text>
  <text x="115" y="951" class="det">branch: main</text>
  <text x="20" y="995" class="note" fill="#C24400">push → webhook (via ngrok)</text>
  <text x="20" y="1013" class="note" fill="#C24400">fallback: Poll SCM every 2 min</text>

  <!-- legend -->
  <g transform="translate(40,1112)" class="note">
    <rect class="box" x="0" y="0" width="34" height="20" rx="4"/><text x="44" y="15">container</text>
    <rect x="140" y="0" width="34" height="20" rx="4" fill="#FFE6D3" stroke="#E25200" stroke-width="3"/><text x="184" y="15">container with a published port</text>
    <rect class="vol" x="400" y="0" width="34" height="20" rx="4"/><text x="444" y="15">named volume</text>
    <rect class="out" x="560" y="0" width="34" height="20" rx="4"/><text x="604" y="15">external service</text>
    <rect x="740" y="0" width="34" height="20" rx="4" fill="#1F3FA6" fill-opacity="0.12" stroke="#1F3FA6" stroke-width="2" stroke-dasharray="6 4"/><text x="784" y="15">web-net</text>
    <rect x="880" y="0" width="34" height="20" rx="4" fill="#F25C05" fill-opacity="0.14" stroke="#E25200" stroke-width="2" stroke-dasharray="6 4"/><text x="924" y="15">data-net</text>
    <path d="M1010,10 H1050" stroke="#0F1F5C" stroke-width="2.5"/><text x="1060" y="15">request</text>
    <path d="M1150,10 H1190" stroke="#E25200" stroke-width="2.5"/><text x="1200" y="15">CI/CD</text>
  </g>
  <text x="40" y="1170" font-size="14.5" font-weight="600">Only the proxy publishes a port (8080). The database and every service port stay inside the networks; only the api can reach the database.</text>
</svg>
