<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEKAI — Library</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="preload"
      href="assets/fonts/The%20Last%20Shuriken.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <!-- boot.js applies saved layout settings before the first paint; the rest run once the page is parsed,
       and blocking="render" holds the first paint until the sidebar and content are built (no flash) -->
    <script src="js/core/boot.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
      defer
    ></script>
    <script src="js/data/sample-data.js" defer></script>
    <script src="js/core/supabase.js" defer></script>
    <!-- start.js checks the session, loads the user's data, then runs these in order -->
    <script
      src="js/core/start.js"
      defer
      data-app="js/core/store.js js/services/tenrai.js js/core/ui.js js/core/neko.js js/core/panes.js js/core/detail-panel.js js/pages/library.js"
    ></script>
  </head>
  <body class="paper">
    <div class="app">
      <main id="main" class="main tight" tabindex="-1">
        <noscript
          ><p class="notice">
            NEKAI needs JavaScript turned on to load your watchlist.
          </p></noscript
        >

        <!-- Library header: title + Add anime, then one toolbar with the status tabs, search and sort -->
        <div class="lib-top">
          <div class="lib-head">
            <h1 class="h1 display-title">Library</h1>
            <a class="btn btn-primary btn-add" href="discover.html"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14"></path></svg
              >Add anime</a
            >
          </div>

          <div class="lib-toolbar">
            <div class="lib-group">
              <div
                id="tabs"
                role="tablist"
                aria-label="Filter by status"
                class="lib-tabs"
              ></div>
            </div>
            <div class="lib-tools">
              <div class="lib-search">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="M20 20l-3.5-3.5"></path>
                </svg>
                <label class="sr" for="q">Search your list</label>
                <input
                  id="q"
                  name="q"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Search your list"
                  aria-describedby="q-count"
                />
              </div>
              <label class="lib-sort">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path>
                </svg>
                <span class="sr">Sort by</span>
                <select id="sort" name="sort">
                  <option value="updated">Recently updated</option>
                  <option value="rating">Your rating</option>
                  <option value="score">Tenrai score</option>
                  <option value="title">Title (A–Z)</option>
                </select>
              </label>
            </div>
          </div>
          <div class="lib-meta">
            <p id="q-count" class="lib-count" role="status"></p>
            <div class="lib-meta-tools">
              <!-- turns selection mode on and off (filled by library.js) -->
              <button
                id="select-toggle"
                type="button"
                class="select-toggle"
                aria-pressed="false"
                title="Select several anime (Ctrl+click or Shift+click also work)"
              ></button>
              <div
                id="view-toggle"
                class="view-toggle"
                role="group"
                aria-label="Layout"
              ></div>
            </div>
          </div>
        </div>

        <div class="stack gap-8">
          <div id="list-bar" class="list-bar">
            <div class="list-head list-cols table-head" aria-hidden="true">
              <span></span><span>TITLE</span><span>EPISODES</span
              ><span>YOUR RATING</span><span>STATUS</span><span></span>
            </div>
          </div>
          <div
            id="panel"
            role="tabpanel"
            class="stack gap-16 library-list"
          ></div>
        </div>

        <!-- bulk actions for the selected anime: slides up while selecting (library.js fills it) -->
        <div
          id="bulk-bar"
          class="bulk-bar"
          role="region"
          aria-label="Actions for selected anime"
          hidden
        ></div>
      </main>
    </div>
  </body>
</html>
