<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEKAI — Library</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preload" href="assets/fonts/The%20Last%20Shuriken.ttf" as="font" type="font/ttf" crossorigin>
  <!-- boot.js applies saved layout settings before the first paint; the rest run once the page is parsed,
       and blocking="render" holds the first paint until the sidebar and content are built (no flash) -->
  <script src="js/core/boot.js"></script>
  <script src="js/data/sample-data.js" defer blocking="render"></script>
  <script src="js/core/store.js" defer blocking="render"></script>
  <script src="js/services/tenrai.js" defer blocking="render"></script>
  <script src="js/core/ui.js" defer blocking="render"></script>
  <script src="js/core/lolli.js" defer blocking="render"></script>
  <script src="js/core/panes.js" defer blocking="render"></script>
  <script src="js/core/detail-panel.js" defer blocking="render"></script>
  <script src="js/pages/library.js" defer blocking="render"></script>
</head>
<body class="paper">
  <div class="app">
    <main id="main" class="main tight" tabindex="-1">
      <noscript><p class="notice">NEKAI needs JavaScript turned on to load your watchlist.</p></noscript>

      <div class="page-actions">
        <div class="page-head">
          <div class="page-title"><h1 class="h1 display-title">Library</h1><span class="jp-tag" aria-hidden="true">ライブラリ</span></div>
          <p id="total" class="body muted"></p>
        </div>
        <a class="btn btn-primary btn-add" href="discover.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add anime</a>
      </div>

      <div class="stack gap-24">
        <div class="row gap-16" style="align-items:flex-end">
          <div style="width:min(384px,100%)">
            <label class="label" for="q">Search your list</label>
            <input id="q" name="q" class="input" type="search" autocomplete="off" spellcheck="false" aria-describedby="q-count">
          </div>
          <div style="width:min(224px,100%)">
            <label class="label" for="sort">Sort by</label>
            <select id="sort" name="sort" class="input select">
              <option value="updated">Recently updated</option>
              <option value="rating">Your rating</option>
              <option value="score">Tenrai score</option>
              <option value="title">Title (A–Z)</option>
            </select>
          </div>
          <p id="q-count" class="small muted bold ml-auto" role="status" style="padding-bottom:8px"></p>
        </div>
        <div id="tabs" role="tablist" aria-label="Filter by status" class="row gap-8"></div>
      </div>

      <div class="stack gap-8">
        <div id="list-bar" class="list-bar">
          <div class="list-head list-cols table-head" aria-hidden="true"><span></span><span>TITLE</span><span>EPISODES</span><span>YOUR RATING</span><span>STATUS</span><span></span></div>
          <div id="view-toggle" class="view-toggle" role="group" aria-label="Layout"></div>
        </div>
        <div id="panel" role="tabpanel" class="stack gap-16 library-list"></div>
      </div>
    </main>
  </div>
</body>
</html>
