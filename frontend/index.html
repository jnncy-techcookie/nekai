<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEKAI — Home</title>
  <meta name="description" content="NEKAI anime watchlist: track episodes, rate shows and get picks that fit your taste.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preload" href="assets/fonts/The%20Last%20Shuriken.ttf" as="font" type="font/ttf" crossorigin>
  <!-- boot.js applies saved layout settings before the first paint; the rest run once the page is parsed,
       and blocking="render" holds the first paint until the sidebar and content are built (no flash) -->
  <script src="js/core/boot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
  <script src="js/data/sample-data.js" defer></script>
  <script src="js/core/supabase.js" defer></script>
  <!-- start.js checks the session, loads the user's data, then runs these in order -->
  <script src="js/core/start.js" defer data-app="js/core/store.js js/services/tenrai.js js/services/recommend.js js/core/ui.js js/core/lolli.js js/core/panes.js js/core/detail-panel.js js/pages/home.js"></script>
</head>
<body class="paper">
  <div class="app">
    <main id="main" class="main" tabindex="-1">
      <noscript><p class="notice">NEKAI needs JavaScript turned on to load your watchlist.</p></noscript>

      <!-- Welcome banner: the greeting, then this week's streak and the latest achievement,
           on one cobalt banner with the brand's seigaiha waves -->
      <header class="hello">
        <section aria-labelledby="page-h" class="hello-greet">
          <h1 id="page-h" class="greet">
            <span class="display-title greet-hello">Welcome back,</span>
            <span id="who" class="name-pop lg" translate="no">Niko</span>
          </h1>
          <p id="intro-sub" class="hello-sub"></p>
        </section>
        <div class="hello-side">
          <section id="streak" aria-labelledby="st-h" class="hello-panel"></section>
          <section id="achievement" aria-labelledby="ach-h" class="hello-panel"></section>
        </div>
      </header>

      <!-- Row 2: the show you're on · your list at a glance -->
      <div class="home-mid">
        <section aria-labelledby="pick-h" class="stack gap-16">
          <h2 id="pick-h" class="h2 sec-title">Pick up where you left off</h2>
          <div id="hero"></div>
        </section>
        <section aria-labelledby="stat-h" class="stack gap-16">
          <h2 id="stat-h" class="h2 sec-title">Status</h2>
          <div id="status" class="st-card"></div>
        </section>
      </div>

      <section aria-labelledby="cont-h" class="stack gap-24">
        <div class="sec-head">
          <h2 id="cont-h" class="h2 sec-title">Continue watching</h2>
          <a id="cont-count" class="btn btn-ghost ml-auto" href="library.html">View all</a>
        </div>
        <div id="continue"></div>
      </section>

      <section aria-labelledby="np-h" class="stack gap-24">
        <div class="sec-head">
          <h2 id="np-h" class="h2 sec-title">Picked for you</h2>
          <a class="btn btn-ghost ml-auto" href="discover.html">More in Discover</a>
        </div>
        <div id="picks"></div>
      </section>
    </main>
  </div>
</body>
</html>
