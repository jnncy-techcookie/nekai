# Serves the static site. The reverse proxy (proxy/) is the only thing that talks to this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The deployed build number: never cached, so a new deploy shows up on the next refresh
    location = /build.json {
        add_header Cache-Control "no-store";
    }

    # Fonts and images rarely change
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Pages, scripts and styles: the browser re-checks them every time (cheap 304s)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
