<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEKAI — Anime details</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preload" href="assets/fonts/The%20Last%20Shuriken.ttf" as="font" type="font/ttf" crossorigin>

       and blocking="render" holds the first paint until the sidebar and content are built (no flash) -->
  <script src="js/core/boot.js"></script>
  <script src="js/data/sample-data.js" defer blocking="render"></script>
  <script src="js/core/store.js" defer blocking="render"></script>
  <script src="js/services/jikan.js" defer blocking="render"></script>
  <script src="js/core/ui.js" defer blocking="render"></script>
  <script src="js/pages/anime.js" defer blocking="render"></script>
</head>
<body class="paper">
  <div class="app">
    <main id="main" class="main tight" tabindex="-1">
      <noscript><p class="notice">NEKAI needs JavaScript turned on to load anime details.</p></noscript>
      <a class="btn btn-ghost self-start" href="discover.html" style="padding:0 16px 0 8px" id="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back
      </a>
      <div id="details"></div>
    </main>
  </div>
</body>
</html>
