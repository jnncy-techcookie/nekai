# NEKAI reverse proxy. Same routing as dev/gateway.js:
#   /api/neko, /api/recommend  ->  ai-service
#   /api/*, /avatars/*         ->  api
#   everything else            ->  frontend
#
# Docker's DNS (127.0.0.11) plus variables in proxy_pass makes Nginx look the names up on every
# request instead of once at startup, so a redeployed container (new IP) is found without
# restarting the proxy, and the proxy starts even if a service is still coming up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Largest body: /api/me/changes (2 MB). Profile pictures are capped at 1 MB by the api.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Gemini answers can take a while
    proxy_read_timeout 60s;

    # The proxy's own health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gemini-powered features. No URI after the variable, so the original path is passed on unchanged.
    location /api/neko/ {
        set $ai http://ai-service:3001;
        proxy_pass $ai;
    }
    location /api/recommend {
        set $ai http://ai-service:3001;
        proxy_pass $ai;
    }

    # Everything else under /api, and the uploaded profile pictures
    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
    }
    location /avatars/ {
        set $api http://api:3000;
        proxy_pass $api;
    }

    # The site
    location / {
        set $web http://frontend:8080;
        proxy_pass $web;
    }
}
